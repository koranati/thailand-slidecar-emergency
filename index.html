<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bangkok Emergency Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif}.top{position:absolute;z-index:1000;top:12px;left:12px;right:12px;background:#fff;padding:12px;border-radius:14px;box-shadow:0 4px 18px #0003}.row{display:flex;gap:8px;flex-wrap:wrap}.title{font-weight:800;margin-bottom:8px}.pill,select,input{border:1px solid #ddd;border-radius:10px;padding:8px;background:white}.pill.active{background:#111;color:#fff}.note{font-size:12px;color:#555;margin-top:7px}.leaflet-popup-content img{width:280px;max-width:70vw;border-radius:8px}</style></head><body><div class="top"><div class="title">Bangkok Emergency Map · CCTV / น้ำท่วม / รถสไลด์</div><div class="row"><button class="pill active" id="cctvBtn">📹 CCTV</button><button class="pill" disabled>🌊 น้ำท่วม</button><button class="pill" disabled>🚚 รถสไลด์</button><select id="district"><option value="">ทุกเขต</option></select><input id="q" placeholder="ค้นหาถนน / แยก / กล้อง"></div><div class="note">แสดงเฉพาะ CCTV/ภาพที่หน่วยงานเปิดเผยสู่สาธารณะ ไม่เข้าถึงกล้องรักษาความปลอดภัยส่วนตัวหรือระบบหลังบ้าน</div></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
