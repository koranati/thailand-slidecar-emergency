<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Bangkok Emergency Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif}.top{position:absolute;z-index:1000;top:env(safe-area-inset-top,0);left:8px;right:8px;margin-top:8px;background:#fffffff2;padding:12px;border-radius:14px;box-shadow:0 4px 18px #0003;backdrop-filter:blur(8px)}.row{display:flex;gap:8px;flex-wrap:wrap}.title{font-weight:800;margin-bottom:8px}.pill,select,input,.link{border:1px solid #ddd;border-radius:10px;padding:9px;background:white;font:inherit}.pill.active{background:#111827;color:#fff}.link{text-decoration:none;color:#111827}.note{font-size:12px;color:#555;margin-top:7px}.status{font-size:12px;margin-top:7px;font-weight:700}.legend{font-size:12px;margin-top:6px}.leaflet-popup-content img{width:280px;max-width:70vw;border-radius:8px}@media(max-width:640px){.top{max-height:45vh;overflow:auto}.row>*{max-width:100%}input{flex:1;min-width:160px}}</style></head><body><div class="top"><div class="title">Bangkok Emergency Map · CCTV / น้ำท่วม / รถสไลด์</div><div class="row"><button class="pill active" data-layer="cctv">📹 CCTV</button><button class="pill active" data-layer="flood">🌊 น้ำท่วม</button><button class="pill active" data-layer="slidecar">🚚 รถสไลด์</button><button class="pill" id="locate">◎ ตำแหน่งฉัน</button><select id="district"><option value="">ทุกเขต</option></select><input id="q" placeholder="ค้นหาถนน / แยก / กล้อง / รถสไลด์"><a class="link" href="https://cpudapp.bangkok.go.th/bmatraffic/" target="_blank" rel="noopener">BMA Traffic ↗</a></div><div id="status" class="status">กำลังโหลดข้อมูล…</div><div class="legend">🟢 CCTV สาธารณะ · 🔵 จุดน้ำท่วม/เฝ้าระวัง · 🟠 รถสไลด์</div><div class="note">CCTV แสดงเฉพาะข้อมูล/ภาพที่หน่วยงานเปิดเผยสู่สาธารณะ จุดน้ำท่วมและรถสไลด์ต้องมีแหล่งข้อมูลตรวจสอบได้ก่อนเผยแพร่</div></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="legacy-map.js"></script></body></html>
